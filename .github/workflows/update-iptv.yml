name: Update IPTV TXT

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/json_to_iptv_txt.py"
      - ".github/workflows/update-iptv.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch IPTV JSON
        run: |
          mkdir -p data
          curl -fsSL "https://api.kaiduan.fun/kd/json/v2/iptv.json" -o data/iptv_v2.json
          curl -fsSL "https://api.kaiduan.fun/kd/json/v1/iptv.json" -o data/iptv_v1.json

      - name: Convert JSON to TXT
        run: |
          python scripts/json_to_iptv_txt.py data/iptv_v2.json iptv_v2.txt
          python scripts/json_to_iptv_txt.py data/iptv_v1.json iptv_v1.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv_v1.txt iptv_v2.txt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update iptv txt playlists"
          git push
